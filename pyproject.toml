[project]
name = "taggui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.4.0",
    "bitsandbytes==0.45.2",
    "datasets>=3.3.2",
    "device-smi>=0.4.1",
    "einops==0.8.1",
    "exifread==3.0.0",
    "flash-attn==2.7.4.post1 ; sys_platform == 'linux'",
    "gptqmodel==1.9.0",
    "hatchling>=1.27.0",
    "huggingface-hub==0.29.1",
    "imagesize==1.4.1",
    "numpy==2.2.3",
    "onnxruntime==1.20.1",
    "pillow==11.1.0",
    "protobuf==5.29.3",
    "pydantic>=2.10.6",
    "pyparsing==3.2.1",
    "pyside6==6.8.2.1",
    "pytest>=8.3.4",
    "sentencepiece==0.2.0",
    "threadpoolctl>=3.5.0",
    "timm==1.0.14",
    "tokenicer>=0.0.4",
    "torch==2.6.0 ; sys_platform != 'win32'",
    "torchvision==0.21.0",
    "transformers==4.48.3",
    "xformers==0.0.29.post3",
]

[project.scripts]
taggui = "run_gui:run_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "taggui/auto_captioning",
    "taggui/dialogs",
    "taggui/models",
    "taggui/utils",
    "taggui/widgets",
    "taggui/run_gui.py",
    "src/caption_tagfile",
]

[tool.pytest.ini_options]
pythonpath = ["src", "taggui"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hatching>=0.0.1",
    "ruff>=0.9.9",
]
